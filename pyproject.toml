[project]
name = "opendistillation"
version = "0.0.0"
description = "Colab-first prototype helpers for turning plain-text notes into small local-model training data."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
